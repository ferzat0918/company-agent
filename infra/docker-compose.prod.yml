# Production overlay. Apply on top of docker-compose.yml on the target LAN host.
#
# Deploy (from repo root on target host):
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --env-file .env pull
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --env-file .env up -d --no-build
#
# Rollback: set APP_VERSION in .env back to the previous tag, repeat the two
# commands above.
#
# Required env vars (in addition to .env.example):
#   APP_VERSION       e.g. 0.1.0
#   IMAGE_REGISTRY    e.g. ghcr.io/ferzat0918
#   SITE_URL          public URL of this deployment, e.g. http://192.168.1.50
#   KONG_PUBLIC_URL   public URL for Kong/Supabase API gateway, e.g. http://192.168.1.50:8000
#   STUDIO_VERSION    pinned Supabase Studio tag, e.g. 2025.10.27-sha-xxxxxxx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    # Bind to loopback only; reachable inside the docker network as `postgres`/`db`.
    ports: !override
      - "127.0.0.1:5432:5432"

  gotrue:
    logging: *default-logging
    ports: !reset []  # accessed via kong:8000 only
    environment:
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: "true"

  pgmeta:
    logging: *default-logging
    ports: !reset []  # admin API — never exposed off-host

  studio:
    image: supabase/studio:${STUDIO_VERSION}
    logging: *default-logging
    ports: !override
      - "127.0.0.1:8081:3000"  # admin UI — reach via SSH tunnel only

  kong:
    logging: *default-logging
    # Public Supabase gateway: keep bound to all interfaces (port 8000).

  langgraph:
    image: ${IMAGE_REGISTRY}/company-agent-langgraph:${APP_VERSION}
    pull_policy: always
    logging: *default-logging
    ports: !override
      - "127.0.0.1:2024:2024"  # frontend reaches it via internal network
    volumes: !override
      - langgraph-data:/app/.langgraph_api  # skills/ and prompts/ are baked into image
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:2024/ok').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  storage:
    logging: *default-logging
    ports: !reset []
    environment:
      STORAGE_PUBLIC_URL: ${KONG_PUBLIC_URL}

  imgproxy:
    logging: *default-logging
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /var/lib/storage

  frontend:
    image: ${IMAGE_REGISTRY}/company-agent-frontend:${APP_VERSION}
    pull_policy: always
    logging: *default-logging
    volumes: !reset []  # static, skills, and nginx.conf are all baked into the image
    depends_on:
      langgraph:
        condition: service_healthy
