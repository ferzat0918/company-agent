# Kong declarative config — Supabase API gateway + LangGraph route.
#
# All browser traffic enters via nginx and is proxied to Kong over the docker
# network. Because the browser only ever talks to nginx (same origin), CORS
# is not triggered, so no CORS plugin is configured here. Restore it only if
# you intend to expose Kong to direct cross-origin browser access.

_format_version: "3.0"

services:
  - name: auth-service
    url: http://gotrue:9999
    routes:
      - name: auth-route
        paths:
          - /auth/v1

  - name: rest-service
    url: http://postgrest:3000
    routes:
      - name: rest-route
        paths:
          - /rest/v1

  - name: storage-service
    url: http://storage:5000
    routes:
      - name: storage-route
        paths:
          - /storage/v1

  - name: realtime-service
    url: http://gotrue:9999
    routes:
      - name: realtime-route
        paths:
          - /realtime/v1

  # LangGraph agent backend. Streams SSE, so disable Kong's response
  # buffering and bump timeouts (LLM generations can take minutes).
  - name: langgraph-service
    url: http://langgraph:2024
    connect_timeout: 60000
    read_timeout: 600000
    write_timeout: 600000
    routes:
      - name: langgraph-route
        paths:
          - /agent/v1
        strip_path: true
        request_buffering: false
        response_buffering: false
