# Usage:  docker compose --env-file ../.env up -d
# The project uses a single .env at the repo root.

services:
  postgres:
    image: supabase/postgres:15.14.1.121
    container_name: supabase-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      default:
        aliases:
          - db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gotrue:
    image: supabase/gotrue:v2.189.0
    container_name: supabase-gotrue
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      API_EXTERNAL_URL: ${SITE_URL}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_DISABLE_SIGNUP: "false"
      PORT: 9999
    depends_on:
      postgres:
        condition: service_healthy

  pgmeta:
    image: supabase/postgres-meta:v0.96.5
    container_name: supabase-pgmeta
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:8080/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  studio:
    image: supabase/studio:latest  # has :latest tag
    container_name: supabase-studio
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://pgmeta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
    depends_on:
      pgmeta:
        condition: service_started

  kong:
    image: kong:3.9  # official Kong image (supabase/kong not available)
    container_name: supabase-kong
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors,key-auth
    volumes:
      - ./kong.yml:/etc/kong/kong.yml

  langgraph:
    build:
      context: ../
      dockerfile: infra/Dockerfile.langgraph
    container_name: company-agent-langgraph
    restart: unless-stopped
    ports:
      - "2024:2024"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      POSTGRES_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SKILLS_DIR: skills
      PROMPTS_DIR: prompts
      LANGGRAPH_CHECKPOINTER: '{"backend":"custom","path":"./backend/src/store_setup.py:create_checkpointer"}'
      LANGGRAPH_STORE: '{"path":"./backend/src/store_setup.py:create_store"}'
      LANGSMITH_TRACING: ${LANGSMITH_TRACING}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
    volumes:
      # :ro hardens the container — even if the agent's permission rules
      # are ever weakened, the kernel will still reject writes into these
      # mounts (which point back to the host's skills/ and prompts/).
      - ../skills:/app/skills:ro
      - ../prompts:/app/prompts:ro
      # Live-mount backend source for fast dev iteration. Without this,
      # every host-side code change needs a `docker compose build`
      # before pytest / runtime can see it.  src/ is writeable so pip's
      # editable install can refresh egg-info on package additions.
      - ../backend/src:/app/backend/src
      - ../backend/tests:/app/backend/tests
      - langgraph-data:/app/.langgraph_api
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    image: supabase/storage-api:v1.48.26
    container_name: supabase-storage
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@postgres:5432/postgres
      STORAGE_PUBLIC_URL: ${SITE_URL}:8000
      POSTGREST_URL: http://pgmeta:8080
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    container_name: supabase-imgproxy
    restart: unless-stopped
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_AUTO_WEBP: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: 16.8

  frontend:
    image: nginx:alpine
    container_name: company-agent-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../frontend/agent-chat-ui/out:/usr/share/nginx/html:ro
      - ../skills:/srv/skills:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - langgraph

  # Cloudflare Tunnel — exposes the frontend on a public hostname without
  # opening any inbound port. Only starts when CLOUDFLARED_TOKEN is set in
  # .env; with the token blank, this container exits immediately and the
  # rest of the stack is unaffected (LAN access still works).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: company-agent-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - frontend

volumes:
  postgres-data:
  langgraph-data:
  storage-data:
