server {
    listen 80;
    server_name _;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Skill assets (images, SVGs, PDFs)
    location /skills/ {
        alias /srv/skills/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
