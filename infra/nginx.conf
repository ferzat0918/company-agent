server {
    listen 80;
    server_name _;

    # Allow uploading files up to 50MB
    client_max_body_size 50m;

    # Gzip Compression for high-performance (HTML, CSS, JS, SVG, Fonts)
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # Cache-Control for Next.js immutable built static assets (includes CSS, JS, Media/Fonts)
    location /_next/static/ {
        root /usr/share/nginx/html;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
        
        # Ensure HTML pages are checked for updates immediately
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Skill assets (images, SVGs, PDFs)
    location /skills/ {
        alias /srv/skills/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Workspace files (user uploads & agent generated files)
    location /workspace/ {
        alias /srv/workspace/;
        autoindex off;
    }

    # Supabase APIs — proxied to Kong so the browser sees one origin.
    # Same-origin means no CORS, and no host/port baked into frontend JS.
    location ~ ^/(auth|rest|storage|realtime)/v1/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LangGraph agent — SSE stream, must disable buffering and bump timeouts.
    location /agent/v1/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
