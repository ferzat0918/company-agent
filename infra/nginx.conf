server {
    listen 80;
    server_name _;

    # Allow uploading files up to 50MB
    client_max_body_size 50m;


    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Skill assets (images, SVGs, PDFs)
    location /skills/ {
        alias /srv/skills/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Supabase APIs — proxied to Kong so the browser sees one origin.
    # Same-origin means no CORS, and no host/port baked into frontend JS.
    location ~ ^/(auth|rest|storage|realtime)/v1/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LangGraph agent — SSE stream, must disable buffering and bump timeouts.
    location /agent/v1/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
