<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Agent — 产品体验 Walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e1a;
  --bg-sidebar: #0d1117;
  --bg-chat: #111827;
  --bg-input: #1a1f2e;
  --bg-bubble-user: #1e3a5f;
  --bg-bubble-ai: #1a1f2e;
  --bg-card: rgba(17, 24, 39, 0.8);
  --border: rgba(255,255,255,0.08);
  --border-active: rgba(59,130,246,0.4);
  --text: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #3b82f6;
  --accent-purple: #8b5cf6;
  --accent-green: #10b981;
  --accent-pink: #ec4899;
  --accent-orange: #f59e0b;
  --accent-cyan: #06b6d4;
  --gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
  --radius: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh; overflow: hidden;
  display: flex;
}

/* ===== ONBOARDING OVERLAY ===== */
.onboarding-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.85);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
}
.onboarding-card {
  background: var(--bg-chat); border: 1px solid var(--border);
  border-radius: 16px; padding: 40px; max-width: 480px; width: 90%;
  text-align: center;
}
.onboarding-card h2 {
  font-size: 28px; font-weight: 800; margin-bottom: 8px;
}
.onboarding-card h2 .gradient {
  background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.onboarding-card .sub {
  font-size: 14px; color: var(--text-secondary); margin-bottom: 28px;
}
.persona-list {
  display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px;
}
.persona-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px; border-radius: var(--radius);
  border: 1px solid var(--border); cursor: pointer;
  transition: all 0.2s; text-align: left; background: rgba(255,255,255,0.02);
}
.persona-card:hover { border-color: var(--border-active); background: rgba(59,130,246,0.06); }
.persona-card.selected { border-color: var(--accent); background: rgba(59,130,246,0.1); }
.persona-card .p-avatar {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700;
}
.persona-card .p-info .p-name { font-size: 15px; font-weight: 600; }
.persona-card .p-info .p-role { font-size: 12px; color: var(--text-muted); }
.btn-start {
  display: inline-block; padding: 12px 40px; border-radius: 10px;
  background: var(--gradient); color: #fff; font-weight: 600; font-size: 15px;
  border: none; cursor: pointer; transition: opacity 0.2s; font-family: inherit;
}
.btn-start:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-start:hover:not(:disabled) { opacity: 0.9; }

/* ===== LAYOUT ===== */
.app { display: flex; width: 100%; height: 100vh; }
.app.hidden { display: none; }

/* Sidebar */
.sidebar {
  width: 280px; flex-shrink: 0; background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px;
}
.sidebar-logo {
  font-size: 18px; font-weight: 700; margin-bottom: 24px;
  background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.sidebar-section { margin-bottom: 20px; }
.sidebar-section .s-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 2px; color: var(--text-muted); margin-bottom: 8px;
}
.sidebar-user {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
}
.sidebar-user .avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.sidebar-user .u-info .u-name { font-size: 14px; font-weight: 600; }
.sidebar-user .u-info .u-dept { font-size: 12px; color: var(--text-muted); }

.skill-status {
  display: flex; flex-direction: column; gap: 6px;
}
.skill-indicator {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 6px;
  font-size: 12px; color: var(--text-muted);
}
.skill-indicator .dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
}
.skill-indicator .dot.off { background: var(--text-muted); opacity: 0.4; }
.skill-indicator .dot.on { background: var(--accent-green); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
.skill-indicator .dot.loading {
  background: var(--accent-orange); animation: pulse-dot 0.8s infinite;
}
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* Chat area */
.chat-area {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  background: var(--bg-chat);
}
.chat-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.chat-header .thread-title {
  font-size: 14px; font-weight: 600;
  color: var(--text-secondary);
}
.chat-header .badge {
  font-size: 11px; padding: 3px 10px; border-radius: 20px;
  background: rgba(59,130,246,0.15); color: var(--accent);
}
.chat-messages {
  flex: 1; overflow-y: auto; padding: 24px;
  display: flex; flex-direction: column; gap: 16px;
}
.chat-input-area {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 10px;
}
.chat-input-area input {
  flex: 1; padding: 12px 16px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-input);
  color: var(--text); font-family: inherit; font-size: 14px;
  outline: none; transition: border-color 0.2s;
}
.chat-input-area input:focus { border-color: var(--accent); }
.chat-input-area button {
  padding: 12px 20px; border-radius: 10px; border: none;
  background: var(--gradient); color: #fff; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 600;
  transition: opacity 0.2s;
}
.chat-input-area button:hover { opacity: 0.9; }

/* Bubbles */
.message {
  display: flex; gap: 12px; max-width: 720px;
  animation: msgIn 0.35s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.user .bubble { background: var(--bg-bubble-user); border-radius: 16px 16px 4px 16px; }
.message.ai .bubble { background: var(--bg-bubble-ai); border-radius: 16px 16px 16px 4px; border: 1px solid var(--border); }
.bubble {
  padding: 12px 18px; font-size: 14px; line-height: 1.7; color: var(--text);
  white-space: pre-wrap; word-break: break-word;
}
.bubble p { margin-bottom: 6px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul { margin: 6px 0; padding-left: 18px; }
.bubble li { margin-bottom: 4px; color: var(--text-secondary); }
.bubble strong { color: var(--text); }
.bubble em { color: var(--accent-cyan); font-style: normal; }
.bubble code {
  background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
}

.system-msg {
  align-self: center; font-size: 11px; color: var(--text-muted);
  padding: 4px 12px; border-radius: 20px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.system-msg .sys-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 600;
}
.sys-tag.route { background: rgba(139,92,246,0.2); color: var(--accent-purple); }
.sys-tag.skill { background: rgba(16,185,129,0.2); color: var(--accent-green); }
.sys-tag.memory { background: rgba(245,158,11,0.2); color: var(--accent-orange); }
.sys-tag.todo { background: rgba(59,130,246,0.2); color: var(--accent); }

.thinking-dots {
  display: inline-flex; gap: 4px; padding: 8px 0;
}
.thinking-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted);
  animation: dotBounce 1.4s infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
.thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotBounce { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }

/* Suggested prompts */
.suggested-prompts {
  display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
}
.suggested-prompts button {
  padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text-secondary);
  font-family: inherit; font-size: 12px; cursor: pointer;
  transition: all 0.2s;
}
.suggested-prompts button:hover {
  border-color: var(--accent); color: var(--text); background: rgba(59,130,246,0.08);
}

/* Scrollbar */
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: transparent; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

/* Responsive */
@media (max-width: 720px) {
  .sidebar { display: none; }
  .message { max-width: 100%; }
}
</style>
</head>
<body>

<!-- ===== ONBOARDING ===== -->
<div class="onboarding-overlay" id="onboarding">
  <div class="onboarding-card">
    <h2>欢迎使用 <span class="gradient">Company Agent</span></h2>
    <p class="sub">公司内部智能助手 — 请选择你的身份开始体验</p>
    <div class="persona-list">
      <div class="persona-card" data-persona="marketing-cn" onclick="selectPersona(this)">
        <div class="p-avatar" style="background:rgba(236,72,153,0.15);color:var(--accent-pink);">M</div>
        <div class="p-info">
          <div class="p-name">小林 — 营销经理</div>
          <div class="p-role">Marketing · 大陆市场 · 文案 & 社媒运营</div>
        </div>
      </div>
      <div class="persona-card" data-persona="hr" onclick="selectPersona(this)">
        <div class="p-avatar" style="background:rgba(16,185,129,0.15);color:var(--accent-green);">H</div>
        <div class="p-info">
          <div class="p-name">李姐 — HR 主管</div>
          <div class="p-role">Human Resources · 招聘 & 员工关系</div>
        </div>
      </div>
      <div class="persona-card" data-persona="marketing-overseas" onclick="selectPersona(this)">
        <div class="p-avatar" style="background:rgba(6,182,212,0.15);color:var(--accent-cyan);">A</div>
        <div class="p-info">
          <div class="p-name">Alex — 海外市场</div>
          <div class="p-role">Marketing · 海外市场 · Instagram / Email</div>
        </div>
      </div>
      <div class="persona-card" data-persona="content" onclick="selectPersona(this)">
        <div class="p-avatar" style="background:rgba(245,158,11,0.15);color:var(--accent-orange);">C</div>
        <div class="p-info">
          <div class="p-name">小陈 — 内容编导</div>
          <div class="p-role">Content · 选题策划 & 拍摄剪辑</div>
        </div>
      </div>
    </div>
    <button class="btn-start" id="btnStart" disabled onclick="startExperience()">进入体验</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app hidden" id="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">Company Agent</div>

    <div class="sidebar-section">
      <div class="s-label">当前身份</div>
      <div class="sidebar-user" id="sidebarUser"></div>
    </div>

    <div class="sidebar-section">
      <div class="s-label">Agent 状态</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--accent-green);display:inline-block;"></span>
          Supervisor 在线
        </div>
        <div style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--accent-green);display:inline-block;"></span>
          <span id="activeSubAgent">等待路由...</span>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="s-label">已加载 Skill</div>
      <div class="skill-status" id="skillStatus">
        <div class="skill-indicator"><span class="dot off"></span> 尚未加载</div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="s-label">长期记忆</div>
      <div id="memoryPreview" style="font-size:12px;color:var(--text-muted);">
        暂无记录
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="thread-title" id="threadTitle">新对话</div>
      <span class="badge" id="regionBadge">大陆</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendMessage()" />
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let state = {
  persona: null,
  loadedSkills: [],
  activeSubAgent: null,
  memory: {},
  messageCount: 0
};

// ===== PERSONA DATA =====
const personas = {
  'marketing-cn': {
    name: '小林', dept: 'marketing', role: '营销经理', region: 'cn',
    avatar: 'M', avatarBg: 'rgba(236,72,153,0.15)', avatarColor: 'var(--accent-pink)',
    subAgent: 'marketing-agent',
    departmentName: 'Marketing 营销部',
    greeting: '你好！我是你的 AI 助手，已识别你的身份为营销部大陆市场负责人。随时可以帮你写文案、策划活动、检查合规。有什么需要？'
  },
  'hr': {
    name: '李姐', dept: 'hr', role: 'HR 主管', region: null,
    avatar: 'H', avatarBg: 'rgba(16,185,129,0.15)', avatarColor: 'var(--accent-green)',
    subAgent: 'hr-agent',
    departmentName: 'HR 人力资源部',
    greeting: '你好！已认证你的 HR 主管身份。需要起草内部公告、招聘话术、培训材料，还是查询员工手册？请随时告诉我。'
  },
  'marketing-overseas': {
    name: 'Alex', dept: 'marketing', role: '海外市场经理', region: 'overseas',
    avatar: 'A', avatarBg: 'rgba(6,182,212,0.15)', avatarColor: 'var(--accent-cyan)',
    subAgent: 'marketing-agent',
    departmentName: 'Marketing 营销部（海外）',
    greeting: 'Hi! I\'ve identified you as the overseas marketing lead. I can help with English copywriting, Instagram/Twitter posts, email campaigns, and brand compliance. What would you like to work on?'
  },
  'content': {
    name: '小陈', dept: 'content', role: '内容编导', region: 'cn',
    avatar: 'C', avatarBg: 'rgba(245,158,11,0.15)', avatarColor: 'var(--accent-orange)',
    subAgent: 'content-agent',
    departmentName: 'Content 内容部',
    greeting: '你好！已确认你的内容编导身份。需要帮你做选题策划、分镜脚本、还是查询各平台规范？直接说就行。'
  }
};

let persona;

// ===== ONBOARDING =====
function selectPersona(el) {
  document.querySelectorAll('.persona-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btnStart').disabled = false;
}

function startExperience() {
  const selected = document.querySelector('.persona-card.selected');
  if (!selected) return;
  const key = selected.dataset.persona;
  persona = personas[key];
  state.persona = key;
  state.loadedSkills = [];
  state.activeSubAgent = null;
  state.memory = {};
  state.messageCount = 0;

  // Hide onboarding
  document.getElementById('onboarding').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');

  // Setup sidebar
  const userEl = document.getElementById('sidebarUser');
  userEl.innerHTML = `
    <div class="avatar" style="background:${persona.avatarBg};color:${persona.avatarColor};">${persona.avatar}</div>
    <div class="u-info">
      <div class="u-name">${persona.name}</div>
      <div class="u-dept">${persona.role} · ${persona.departmentName}</div>
    </div>
  `;
  document.getElementById('regionBadge').textContent = persona.region === 'overseas' ? '海外' : (persona.region === 'cn' ? '大陆' : '通用');
  document.getElementById('regionBadge').className = 'badge';
  document.getElementById('threadTitle').textContent = '新对话';
  document.getElementById('activeSubAgent').textContent = '等待路由...';
  document.getElementById('skillStatus').innerHTML = '<div class="skill-indicator"><span class="dot off"></span> 尚未加载</div>';
  document.getElementById('memoryPreview').textContent = '暂无记录';

  // Clear chat
  document.getElementById('chatMessages').innerHTML = '';

  // Greeting
  addMessage('ai', persona.greeting);

  // Suggested prompts
  addSuggestedPrompts();
}

// ===== CHAT =====
function addMessage(role, text, delay = 0) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  const avatarHtml = role === 'user'
    ? `<div class="avatar" style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:${persona.avatarBg};color:${persona.avatarColor};">${persona.avatar}</div>`
    : `<div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(139,92,246,0.2));">🤖</div>`;
  div.innerHTML = avatarHtml + `<div class="bubble">${text}</div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addSystemMsg(tag, tagClass, text) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.innerHTML = `<span class="sys-tag ${tagClass}">${tag}</span> ${text}`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function showThinking(duration) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'thinking-msg';
  div.innerHTML = `<div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:linear-gradient(135deg,rgba(59,130,246,0.2),rgba(139,92,246,0.2));">🤖</div><div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return new Promise(resolve => setTimeout(() => {
    const el = document.getElementById('thinking-msg');
    if (el) el.remove();
    resolve();
  }, duration));
}

function addSuggestedPrompts() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'suggested-prompts';
  div.id = 'suggested-prompts';

  let prompts = [];
  switch (state.persona) {
    case 'marketing-cn':
      prompts = ['帮我写一篇小红书种草文案，产品是新款智能手表', '检查这段文案有没有广告法问题', '给我一个双十一活动策划框架', '帮我写个微信公众号推文'];
      break;
    case 'hr':
      prompts = ['帮我起草一份新员工入职通知', '写一段招聘产品经理的 JD', '员工手册里关于年假的规定是什么', '帮我写一份内部培训通知'];
      break;
    case 'marketing-overseas':
      prompts = ['Write an Instagram post for our new tech product', 'Draft a marketing email for US customers', 'Check if this copy aligns with our brand voice', 'Create a Black Friday campaign outline'];
      break;
    case 'content':
      prompts = ['帮我策划一期关于 AI 工具的短视频选题', '写一个 60 秒抖音口播脚本', '小红书 B 站 抖音 — 同一个选题怎么差异化', '拍摄产品的分镜脚本怎么写'];
      break;
  }

  div.innerHTML = prompts.map(p => `<button onclick="quickPrompt('${p.replace(/'/g, "\\'")}')">${p}</button>`).join('');
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeSuggestedPrompts() {
  const el = document.getElementById('suggested-prompts');
  if (el) el.remove();
}

function quickPrompt(text) {
  removeSuggestedPrompts();
  addMessage('user', text);
  state.messageCount++;
  handleUserMessage(text);
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  removeSuggestedPrompts();
  addMessage('user', text);
  state.messageCount++;

// ===== SIDEBAR HELPERS =====
function updateActiveSubAgent(name) {
  state.activeSubAgent = name;
  document.getElementById('activeSubAgent').textContent = name;
}

function addSkillToSidebar(id, label) {
  if (state.loadedSkills.find(s => s.id === id)) return;
  state.loadedSkills.push({ id, label });

  const container = document.getElementById('skillStatus');
  if (state.loadedSkills.length === 1) container.innerHTML = '';

  const div = document.createElement('div');
  div.className = 'skill-indicator';
  div.id = 'skill-' + id;
  div.innerHTML = `<span class="dot loading"></span> ${label}`;
  container.appendChild(div);

  // Animate to loaded
  setTimeout(() => {
    const dot = div.querySelector('.dot');
    if (dot) { dot.classList.remove('loading'); dot.classList.add('on'); }
  }, 1200);
}

function saveMemory(key, value) {
  state.memory[key] = value;
  const preview = document.getElementById('memoryPreview');
  const entries = Object.entries(state.memory);
  if (entries.length === 0) {
    preview.textContent = '暂无记录';
  } else {
    preview.innerHTML = entries.map(([k, v]) =>
      `<div style="margin-bottom:4px;"><strong>${k}:</strong> ${v.slice(0, 40)}${v.length > 40 ? '...' : ''}</div>`
    ).join('');
  }
}
